<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goodbye Mate — redirecting</title>
    <!--
      WHY THIS FILE EXISTS

      The Vercel project "goodbye-mate" (goodbye-mate.vercel.app) is
      linked to this repo but has NO root directory and NO framework
      configured, so it never builds apps/web-admin — its "builds" finish
      in under two seconds and it serves whatever static files sit at the
      repo root.

      That URL therefore served a stale, months-old admin bundle while
      looking completely normal, which repeatedly made new work appear
      not to have shipped. Rather than leave a plausible-looking but
      wrong app on a memorable URL, anyone landing here is sent to the
      correctly-built admin app.

      The three real apps set an explicit rootDirectory (apps/web-admin,
      apps/web-vet, apps/web-client) and are unaffected by this file.

      This can be deleted once the legacy "goodbye-mate" project is
      removed from Vercel.
    -->
    <meta http-equiv="refresh" content="0; url=https://goodbye-mate-admin-app-goodbye-mate.vercel.app/" />
    <script>
      window.location.replace('https://goodbye-mate-admin-app-goodbye-mate.vercel.app/');
    </script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #FAF7F1;
        color: #2A2620;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 24px;
        text-align: center;
      }
      .box { max-width: 420px; }
      h1 { font-size: 20px; margin-bottom: 12px; color: #33453A; }
      p { font-size: 15px; line-height: 1.6; color: #6B6559; }
      a { color: #33453A; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>This is the old address</h1>
      <p>
        Taking you to the current Goodbye Mate admin app. If nothing happens,
        <a href="https://goodbye-mate-admin-app-goodbye-mate.vercel.app/">tap here</a>.
      </p>
      <p>
        Please update your bookmark — this old address does not receive updates.
      </p>
    </div>
  </body>
</html>
